[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buntai-lint"
version = "0.1.0"
description = "日本語リンター / Japanese writing linter for commits, reports, agent handoffs and customer-facing text. Every rule cites a Japanese public standard. Zero dependencies, no LLM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["japanese", "linter", "proofreading", "校正", "日本語", "文体", "technical-writing", "ai-writing", "commit-msg", "textlint", "report"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Japanese",
  "Natural Language :: Korean",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: German",
  "Natural Language :: French",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
buntai = "buntai.__main__:main"

[tool.setuptools]
packages = ["buntai"]

[tool.setuptools.package-data]
buntai = ["rules/*.json"]
