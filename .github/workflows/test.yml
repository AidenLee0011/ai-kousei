name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: selftest
        run: |
          python -m ai_kousei selftest
      - name: lint a sample message
        run: |
          python -m ai_kousei lint -m "fix: キャッシュ追加" --lang ja

  citations:
    # Every rule quotes a clause. This job downloads the cited documents and
    # checks the quotes verbatim, so a rule can never drift into invention.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install fetch dependencies
        run: |
          pip install requests beautifulsoup4 pdfminer.six
      - name: fetch the cited documents
        run: |
          python sources/fetch_ja_sources.py
      - name: verify every quotation verbatim
        run: |
          python sources/verify_quotes.py --lang ja
