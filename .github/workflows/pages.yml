name: demo

on:
  push:
    branches: [main]
    paths:
      - "docs/demo/**"
      - "ai_kousei/rules/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: rebuild the demo bundle
        run: |
          python docs/build_web.py --out docs/demo
      - name: publish to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/pages gh-pages
          find /tmp/pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r docs/demo/. /tmp/pages/
          cd /tmp/pages
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "demo site"
          git push origin gh-pages
