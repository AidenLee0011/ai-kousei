<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system,Segoe UI,Hiragino Sans,Noto Sans JP,sans-serif"><rect width="1200" height="560" fill="#ffffff"/><text x="30" y="36" font-size="18" font-weight="700" fill="#1f2328">用途ごとに規則が変わる。対顧客では敬体が正解、記録では敬体が誤り。</text><text x="30" y="58" font-size="12.5" fill="#6e7781">ringi lint --profile commit | report | agent | customer</text><text x="30" y="100" font-size="13.5" font-weight="700" fill="#1f2328">報告書  --profile report</text><rect x="30" y="110" width="550" height="112" rx="8" fill="#e5534b" fill-opacity="0.05" stroke="#e5534b" stroke-opacity="0.45"/><text x="44" y="130" font-size="11" font-weight="700" fill="#e5534b">AS-IS</text><text x="44" y="152" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">本日、キャッシュ機構の全面刷新を行いました。これにより、</text><text x="44" y="172" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">応答速度が大幅に改善されたと考えております。</text><text x="44" y="212" font-size="11.5" fill="#6e7781">誇張・冗長・数値なし</text><rect x="620" y="110" width="550" height="112" rx="8" fill="#3fb950" fill-opacity="0.05" stroke="#3fb950" stroke-opacity="0.45"/><text x="634" y="130" font-size="11" font-weight="700" fill="#3fb950">TO-BE</text><text x="634" y="152" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">1 概要  商品詳細APIの応答改善</text><text x="634" y="172" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">2 対応  Redis を前段に追加。TTL 300秒</text><text x="634" y="192" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">3 結果  p95 820ms → 210ms</text><text x="634" y="212" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">以上</text><text x="634" y="212" font-size="11.5" fill="#6e7781">見出し階層 第1→1→(1)→ア、結果は実測値</text><text x="30" y="262" font-size="13.5" font-weight="700" fill="#1f2328">エージェント間  --profile agent</text><rect x="30" y="272" width="550" height="112" rx="8" fill="#e5534b" fill-opacity="0.05" stroke="#e5534b" stroke-opacity="0.45"/><text x="44" y="292" font-size="11" font-weight="700" fill="#e5534b">AS-IS</text><text x="44" y="314" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">エラー時は適宜リトライし、必要に応じて通知する。</text><text x="44" y="334" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">確認しました。対応済み。</text><text x="44" y="374" font-size="11.5" fill="#6e7781">曖昧語・動作主なし = 機械が実行できない</text><rect x="620" y="272" width="550" height="112" rx="8" fill="#3fb950" fill-opacity="0.05" stroke="#3fb950" stroke-opacity="0.45"/><text x="634" y="292" font-size="11" font-weight="700" fill="#3fb950">TO-BE</text><text x="634" y="314" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">エラー時は最大3回・10秒間隔でリトライする。</text><text x="634" y="334" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">3回失敗したら Slack #ops へ通知する。</text><text x="634" y="374" font-size="11.5" fill="#6e7781">数値・条件・対象を明示</text><text x="30" y="424" font-size="13.5" font-weight="700" fill="#1f2328">対顧客  --profile customer</text><rect x="30" y="434" width="550" height="112" rx="8" fill="#e5534b" fill-opacity="0.05" stroke="#e5534b" stroke-opacity="0.45"/><text x="44" y="454" font-size="11" font-weight="700" fill="#e5534b">AS-IS</text><text x="44" y="476" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">本日デプロイを実施し、キャッシュ削除を行った。</text><text x="44" y="496" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">ご利用は可能である。</text><text x="44" y="536" font-size="11.5" fill="#6e7781">常体・社内用語</text><rect x="620" y="434" width="550" height="112" rx="8" fill="#3fb950" fill-opacity="0.05" stroke="#3fb950" stroke-opacity="0.45"/><text x="634" y="454" font-size="11" font-weight="700" fill="#3fb950">TO-BE</text><text x="634" y="476" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">本日、新機能を公開しました。</text><text x="634" y="496" font-size="12.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">表示が古い場合は再読み込みをお願いします。</text><text x="634" y="536" font-size="11.5" fill="#6e7781">敬体・日常語（公用文 Ⅲ-1-ア / Ⅱ 用語）</text></svg>