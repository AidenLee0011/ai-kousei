<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="-apple-system,Segoe UI,Hiragino Sans,Noto Sans JP,sans-serif"><rect width="1200" height="300" fill="#ffffff"/><text x="30" y="36" font-size="18" font-weight="700" fill="#1f2328">コミットが止まる割合（error 発火率）</text><text x="30" y="58" font-size="12.5" fill="#6e7781">人手側は LLM 普及前のコミットのみ。ここでの発火は誤検出として数える。python bench/run.py --lang ja</text><text x="30" y="108" font-size="13" fill="#1f2328">LLM が書いたコミット (n=30)</text><rect x="380" y="92" width="700" height="22" rx="4" fill="#f0f3f6"/><rect x="380" y="92" width="606" height="22" rx="4" fill="#e5534b"/><text x="996" y="108" font-size="13" font-weight="700" fill="#e5534b">86.7%</text><text x="30" y="166" font-size="13" fill="#1f2328">人手・手書き 2022-11 以前 (n=96)</text><rect x="380" y="150" width="700" height="22" rx="4" fill="#f0f3f6"/><rect x="380" y="150" width="14" height="22" rx="4" fill="#3fb950"/><text x="404" y="166" font-size="13" font-weight="700" fill="#3fb950">2.1%</text><text x="30" y="224" font-size="13" fill="#1f2328">人手・squash マージ (n=50)</text><rect x="380" y="208" width="700" height="22" rx="4" fill="#f0f3f6"/><rect x="380" y="208" width="42" height="22" rx="4" fill="#6e7781"/><text x="432" y="224" font-size="13" font-weight="700" fill="#6e7781">6.0%</text><text x="30" y="276" font-size="12" fill="#6e7781">判別に効いた規則（人手 → LLM）: 本文敬体 1.0% → 83.3% ・ 文体混在 1.0% → 80.0% ・ 一文60字超 2.1% → 33.3% ・ 受身多用 0.0% → 13.3%</text></svg>