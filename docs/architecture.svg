<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="-apple-system,Segoe UI,Hiragino Sans,Noto Sans JP,sans-serif"><rect width="1200" height="460" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6e7781"/></marker></defs><text x="30" y="36" font-size="18" font-weight="700" fill="#1f2328">出典 → 規則 → フック。規則の根拠と閾値の出どころが全部たどれる</text><text x="30" y="72" font-size="11.5" font-weight="700" fill="#6e7781">1. 根拠</text><rect x="30" y="82" width="250" height="92" rx="8" fill="#4c8dff" fill-opacity="0.08" stroke="#4c8dff"/><text x="42" y="105" font-size="13" font-weight="700" fill="#1f2328">公用文作成の考え方</text><text x="42" y="125" font-size="11.5" fill="#6e7781">文化審議会建議 2022-01-07</text><text x="42" y="141" font-size="11.5" fill="#6e7781">文体・一文長・受身・階層</text><rect x="30" y="182" width="250" height="78" rx="8" fill="#4c8dff" fill-opacity="0.08" stroke="#4c8dff"/><text x="42" y="205" font-size="13" font-weight="700" fill="#1f2328">JTF日本語標準スタイルガイド</text><text x="42" y="225" font-size="11.5" fill="#6e7781">日本翻訳連盟</text><text x="42" y="241" font-size="11.5" fill="#6e7781">見出し・句読点・カタカナ</text><rect x="30" y="268" width="250" height="78" rx="8" fill="#4c8dff" fill-opacity="0.08" stroke="#4c8dff"/><text x="42" y="291" font-size="13" font-weight="700" fill="#1f2328">textlint-ja プリセット</text><text x="42" y="311" font-size="11.5" fill="#6e7781">技術文書 / AI ライティング</text><text x="42" y="327" font-size="11.5" fill="#6e7781">読点数・漢字連続・誇張</text><rect x="30" y="354" width="250" height="78" rx="8" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950"/><text x="42" y="377" font-size="13" font-weight="700" fill="#1f2328">実測コーパス</text><text x="42" y="397" font-size="11.5" fill="#6e7781">人手コミット 96 / LLM 30</text><text x="42" y="413" font-size="11.5" fill="#6e7781">公開報告書 8 件 8,181 文</text><text x="330" y="72" font-size="11.5" font-weight="700" fill="#6e7781">2. 規則ファイル</text><rect x="330" y="82" width="300" height="350" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="342" y="105" font-size="13" font-weight="700" fill="#1f2328">ai_kousei/rules/ja.json</text><text x="342" y="125" font-size="11.5" fill="#6e7781">1 規則 = pattern + severity + weight</text><text x="342" y="141" font-size="11.5" fill="#6e7781">        + source{doc, loc, quote}</text><text x="342" y="157" font-size="11.5" fill="#6e7781">        + example{before, after}</text><text x="342" y="173" font-size="11.5" fill="#6e7781"></text><text x="342" y="189" font-size="11.5" fill="#6e7781">出典のない規則は入れない。</text><text x="342" y="205" font-size="11.5" fill="#6e7781">selftest が出典解決と、</text><text x="342" y="221" font-size="11.5" fill="#6e7781">AS-IS 例が実際に発火することを検査。</text><text x="342" y="237" font-size="11.5" fill="#6e7781"></text><text x="342" y="253" font-size="11.5" fill="#6e7781">閾値は実測から決める:</text><text x="342" y="269" font-size="11.5" fill="#6e7781">  一文 60 字（公用文 Ⅲ-3-ア）</text><text x="342" y="285" font-size="11.5" fill="#6e7781">  読点 3 個（textlint max-ten）</text><text x="342" y="301" font-size="11.5" fill="#6e7781">  敬体（人手 1.0% / LLM 83.3%）</text><line x1="284" y1="128" x2="326" y2="200" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="284" y1="220" x2="326" y2="220" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="284" y1="306" x2="326" y2="250" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="284" y1="392" x2="326" y2="280" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><text x="680" y="72" font-size="11.5" font-weight="700" fill="#6e7781">3. 実行</text><rect x="680" y="82" width="230" height="84" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="692" y="105" font-size="13" font-weight="700" fill="#1f2328">commit-msg フック</text><text x="692" y="125" font-size="11.5" fill="#6e7781">merge/squash/fixup は除外</text><text x="692" y="141" font-size="11.5" fill="#6e7781">error があれば exit 1</text><rect x="680" y="178" width="230" height="84" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="692" y="201" font-size="13" font-weight="700" fill="#1f2328">ai-kousei lint / rules</text><text x="692" y="221" font-size="11.5" fill="#6e7781">次にやること 1 行 → 5 件</text><text x="692" y="237" font-size="11.5" fill="#6e7781">各指摘に条番号と引用</text><rect x="680" y="274" width="230" height="84" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="692" y="297" font-size="13" font-weight="700" fill="#1f2328">ブラウザデモ</text><text x="692" y="317" font-size="11.5" fill="#6e7781">同じ JSON を読む</text><text x="692" y="333" font-size="11.5" fill="#6e7781">判定がずれない</text><rect x="680" y="370" width="230" height="62" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="692" y="393" font-size="13" font-weight="700" fill="#1f2328">bench/</text><text x="692" y="413" font-size="11.5" fill="#6e7781">閾値の再測定</text><line x1="634" y1="200" x2="676" y2="124" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="634" y1="220" x2="676" y2="220" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="634" y1="240" x2="676" y2="316" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="634" y1="300" x2="676" y2="400" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><rect x="950" y="82" width="220" height="84" rx="8" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b"/><text x="962" y="105" font-size="13" font-weight="700" fill="#1f2328">git commit</text><text x="962" y="125" font-size="11.5" fill="#6e7781">生成文らしければ止まる</text><rect x="950" y="178" width="220" height="84" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="962" y="201" font-size="13" font-weight="700" fill="#1f2328">書き手</text><text x="962" y="221" font-size="11.5" fill="#6e7781">AS-IS → TO-BE を見て直す</text><rect x="950" y="274" width="220" height="84" rx="8" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950"/><text x="962" y="297" font-size="13" font-weight="700" fill="#1f2328">指摘 0 でコミット</text><text x="962" y="317" font-size="11.5" fill="#6e7781">公的基準に沿った記録</text><line x1="914" y1="124" x2="946" y2="124" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="914" y1="220" x2="946" y2="220" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="1060" y1="166" x2="1060" y2="176" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="1060" y1="262" x2="1060" y2="272" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/></svg>