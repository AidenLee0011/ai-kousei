<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" font-family="-apple-system,Segoe UI,Roboto,sans-serif"><rect width="1180" height="340" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6e7781"/></marker></defs><text x="28" y="34" font-size="17" font-weight="700" fill="#1f2328">One rule file, two runtimes, no network</text><text x="28" y="56" font-size="12.5" fill="#6e7781">The hook and the browser demo read the same JSON, so what you try on the page is what blocks your commit.</text><rect x="28" y="96" width="190" height="78" rx="7" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="40" y="120" font-size="13" font-weight="600" fill="#1f2328">git commit</text><text x="40" y="140" font-size="11.5" fill="#6e7781">message written by you</text><text x="40" y="156" font-size="11.5" fill="#6e7781">or by an agent</text><line x1="222" y1="135" x2="258" y2="135" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><rect x="262" y="96" width="190" height="78" rx="7" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="274" y="120" font-size="13" font-weight="600" fill="#1f2328">commit-msg hook</text><text x="274" y="140" font-size="11.5" fill="#6e7781">merge / squash / fixup</text><text x="274" y="156" font-size="11.5" fill="#6e7781">are skipped</text><line x1="456" y1="135" x2="492" y2="135" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><rect x="496" y="96" width="200" height="78" rx="7" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="508" y="120" font-size="13" font-weight="600" fill="#1f2328">language detection</text><text x="508" y="140" font-size="11.5" fill="#6e7781">script for ja / ko / zh</text><text x="508" y="156" font-size="11.5" fill="#6e7781">stopwords for de / fr / es</text><line x1="700" y1="135" x2="736" y2="135" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><rect x="740" y="96" width="200" height="78" rx="7" fill="#4c8dff" fill-opacity="0.08" stroke="#4c8dff"/><text x="752" y="120" font-size="13" font-weight="600" fill="#1f2328">rules/_common.json</text><text x="752" y="140" font-size="11.5" fill="#6e7781">emoji, attribution footer,</text><text x="752" y="156" font-size="11.5" fill="#6e7781">invisible characters</text><rect x="740" y="190" width="200" height="78" rx="7" fill="#4c8dff" fill-opacity="0.08" stroke="#4c8dff"/><text x="752" y="214" font-size="13" font-weight="600" fill="#1f2328">rules/&lt;lang&gt;.json</text><text x="752" y="234" font-size="11.5" fill="#6e7781">language tells, structure,</text><text x="752" y="250" font-size="11.5" fill="#6e7781">report template</text><line x1="840" y1="178" x2="840" y2="188" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><line x1="944" y1="135" x2="980" y2="135" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><rect x="984" y="96" width="168" height="78" rx="7" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="996" y="120" font-size="13" font-weight="600" fill="#1f2328">findings + score</text><text x="996" y="140" font-size="11.5" fill="#6e7781">error blocks the commit</text><text x="996" y="156" font-size="11.5" fill="#6e7781">warning is printed</text><rect x="496" y="214" width="200" height="62" rx="7" fill="#f6f8fa" fill-opacity="1" stroke="#d0d7de"/><text x="508" y="238" font-size="13" font-weight="600" fill="#1f2328">browser demo</text><text x="508" y="258" font-size="11.5" fill="#6e7781">same JSON, same result</text><line x1="736" y1="240" x2="700" y2="240" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/><text x="28" y="300" font-size="12" fill="#6e7781">No model call. No telemetry. Rules load in 4 ms, a message lints in 0.24 ms (measured). Every finding carries the reason and the rewrite in the language being linted.</text></svg>