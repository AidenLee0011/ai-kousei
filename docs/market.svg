<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="378" viewBox="0 0 1180 378" font-family="-apple-system,Segoe UI,Roboto,sans-serif"><rect width="1180" height="378" fill="#ffffff"/><text x="28" y="34" font-size="17" font-weight="700" fill="#1f2328">Where the tooling already exists, and where it does not</text><text x="28" y="56" font-size="12.5" fill="#6e7781">GitHub and npm, measured 2026-08-13. De-AI writing tools cluster in English prose. No language has one for commit messages or pull request bodies.</text><text x="28" y="78" font-size="11.5" font-weight="700" fill="#6e7781">COVERAGE</text><text x="206" y="78" font-size="11.5" fill="#6e7781">prose de-AI tool</text><text x="446" y="78" font-size="11.5" fill="#6e7781">commit / PR tool</text><text x="28" y="109" font-size="13" fill="#1f2328">English</text><rect x="206" y="92" width="232" height="26" rx="4" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.45"/><text x="215" y="109" font-size="11.5" fill="#1f2328">humanizer 35,301 / slopless 319</text><rect x="446" y="92" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="455" y="109" font-size="11.5" fill="#1f2328">commit + PR: none</text><text x="28" y="143" font-size="13" fill="#1f2328">Japanese</text><rect x="206" y="126" width="232" height="26" rx="4" fill="#d29922" fill-opacity="0.10" stroke="#d29922" stroke-opacity="0.45"/><text x="215" y="143" font-size="11.5" fill="#1f2328">textlint-ja ai-writing 1,095</text><rect x="446" y="126" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="455" y="143" font-size="11.5" fill="#1f2328">commit + PR: none</text><text x="28" y="177" font-size="13" fill="#1f2328">Korean</text><rect x="206" y="160" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="215" y="177" font-size="11.5" fill="#1f2328">none above 1 star</text><rect x="446" y="160" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="455" y="177" font-size="11.5" fill="#1f2328">commit + PR: none</text><text x="28" y="211" font-size="13" fill="#1f2328">Chinese</text><rect x="206" y="194" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="215" y="211" font-size="11.5" fill="#1f2328">none above 1 star</text><rect x="446" y="194" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="455" y="211" font-size="11.5" fill="#1f2328">commit + PR: none</text><text x="28" y="245" font-size="13" fill="#1f2328">German</text><rect x="206" y="228" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="215" y="245" font-size="11.5" fill="#1f2328">none above 1 star</text><rect x="446" y="228" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="455" y="245" font-size="11.5" fill="#1f2328">commit + PR: none</text><text x="28" y="279" font-size="13" fill="#1f2328">French</text><rect x="206" y="262" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="215" y="279" font-size="11.5" fill="#1f2328">none above 1 star</text><rect x="446" y="262" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="455" y="279" font-size="11.5" fill="#1f2328">commit + PR: none</text><text x="28" y="313" font-size="13" fill="#1f2328">Spanish</text><rect x="206" y="296" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="215" y="313" font-size="11.5" fill="#1f2328">none above 1 star</text><rect x="446" y="296" width="232" height="26" rx="4" fill="#e5534b" fill-opacity="0.10" stroke="#e5534b" stroke-opacity="0.45"/><text x="455" y="313" font-size="11.5" fill="#1f2328">commit + PR: none</text><text x="700" y="78" font-size="11.5" font-weight="700" fill="#6e7781">DEMAND, MEASURED</text><text x="700" y="104" font-size="12.5" font-weight="600" fill="#1f2328">blader/humanizer</text><text x="960" y="104" font-size="11" fill="#6e7781">EN prose, agent skill</text><rect x="700" y="112" width="400" height="14" rx="3" fill="#4c8dff"/><text x="1108" y="123" font-size="11.5" fill="#6e7781">35,301 stars</text><text x="700" y="166" font-size="12.5" font-weight="600" fill="#1f2328">textlint-ja ai-writing</text><text x="960" y="166" font-size="11" fill="#6e7781">JA prose, textlint</text><rect x="700" y="174" width="70" height="14" rx="3" fill="#4c8dff"/><text x="778" y="185" font-size="11.5" fill="#6e7781">1,095 stars / 48,603 npm dl per month</text><text x="700" y="228" font-size="12.5" font-weight="600" fill="#1f2328">berelevant/slopless</text><text x="960" y="228" font-size="11" fill="#6e7781">EN prose, deterministic</text><rect x="700" y="236" width="38" height="14" rx="3" fill="#4c8dff"/><text x="746" y="247" font-size="11.5" fill="#6e7781">319 stars</text><text x="700" y="290" font-size="12.5" font-weight="600" fill="#1f2328">commit or PR, any language</text><text x="960" y="290" font-size="11" fill="#6e7781">the gap this fills</text><rect x="700" y="298" width="3" height="14" rx="3" fill="#e5534b"/><text x="711" y="309" font-size="11.5" fill="#6e7781">0</text><text x="700" y="344" font-size="11" fill="#6e7781">bar length is square-root scaled</text></svg>