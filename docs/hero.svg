<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="-apple-system,Segoe UI,Hiragino Sans,Noto Sans JP,sans-serif"><rect width="1200" height="430" fill="#ffffff"/><text x="30" y="38" font-size="19" font-weight="700" fill="#1f2328">AI が書いた日本語コミットは、日本語話者が書くコミットと形が違う</text><text x="30" y="62" font-size="13" fill="#6e7781">ringi はその差を、公的文書の条文を根拠に指摘して直す。</text><rect x="30" y="86" width="540" height="300" rx="9" fill="#e5534b" fill-opacity="0.05" stroke="#e5534b" stroke-opacity="0.5"/><rect x="46" y="102" width="86" height="24" rx="5" fill="#e5534b" fill-opacity="0.14"/><text x="60" y="119" font-size="12.5" font-weight="700" fill="#e5534b">AS-IS</text><text x="48" y="152" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">feat: 商品詳細APIにRedisキャッシュを追加</text><text x="48" y="176" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace"></text><text x="48" y="200" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">商品詳細APIの応答速度向上とデータベース負荷軽減の</text><text x="48" y="224" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">ため、Redisキャッシュを導入しました。</text><text x="48" y="248" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">キャッシュの有効期限（TTL）は300秒に設定されて</text><text x="48" y="272" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">います。</text><text x="48" y="296" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">- **重要**: 監視対象に追加しました</text><text x="48" y="368" font-size="12" fill="#6e7781">敬体の説明文・太字ラベル・数値なし  →  score 54 / commit blocked</text><path d="M596 236 L634 236" stroke="#6e7781" stroke-width="2"/><path d="M628 230 L636 236 L628 242 z" fill="#6e7781"/><rect x="650" y="86" width="520" height="300" rx="9" fill="#3fb950" fill-opacity="0.05" stroke="#3fb950" stroke-opacity="0.5"/><rect x="666" y="102" width="86" height="24" rx="5" fill="#3fb950" fill-opacity="0.14"/><text x="680" y="119" font-size="12.5" font-weight="700" fill="#3fb950">TO-BE</text><text x="668" y="152" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">fix: 商品詳細APIにRedisキャッシュを追加</text><text x="668" y="176" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace"></text><text x="668" y="200" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">なぜ: 商品詳細APIの応答が遅く、DB負荷も高い</text><text x="668" y="224" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">なにを: Redis を前段に追加。TTL 300秒</text><text x="668" y="248" font-size="13.5" fill="#1f2328" font-family="Consolas,Noto Sans Mono CJK JP,monospace">確認: p95 820ms → 210ms</text><text x="668" y="368" font-size="12" fill="#6e7781">体言止め・報告3項目・実測値  →  score 100 / passes</text></svg>